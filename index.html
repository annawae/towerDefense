<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tower Defense</title>

  <!-- Telegram Mini App SDK: muss vor dem Spiel-Code geladen werden -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      /* verhindert versehentliches Scrollen/Textmarkieren beim Tippen */
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }



    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    #canvas-wrap {
      position: relative;
      /* Feld ist hochkant (600x800 → Seitenverhältnis 3:4).
         Die Breite wird aus der begrenzten Höhe abgeleitet, damit das Feld
         nicht höher als der sichtbare Bereich wird und nichts verzerrt. */
      aspect-ratio: 3 / 4;
      max-width: 600px;
      max-height: 78vh;
      width: auto;
      height: auto;
      margin: 0 auto;
    }

    canvas {
      display: block;
      border: 2px solid #444;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      touch-action: none; /* eigene Touch-Gesten, kein Browser-Scrollen auf dem Feld */
    }

    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      border-radius: 2px;
    }
    #overlay.active { display: flex; }
    #overlay h2 { font-size: 2.4rem; }
    #overlay h2.win  { color: #6eff6e; }
    #overlay h2.lose { color: #ff6e6e; }
    #overlay p { font-size: 1.1rem; color: #ccc; }

    #sidebar {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #hud {
      width: 100%;
      background: #16213e;
      border: 1px solid #334;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      gap: 16px;
      font-size: 0.95rem;
    }
    #hud .row { display: flex; align-items: center; gap: 6px; }
    #hud .label { color: #aaa; }
    #hud .val-lives  { color: #ff8080; font-weight: bold; }
    #hud .val-gold   { color: #ffd700; font-weight: bold; }
    #hud .val-wave   { color: #80c8ff; font-weight: bold; }

    #shop {
      background: #16213e;
      border: 1px solid #334;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
    }
    #shop h3 { width: 100%; font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }

    .tower-btn {
      flex: 1 1 0;
      min-width: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 5px;
      padding: 10px 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      color: #eee;
      font-size: 0.85rem;
      text-align: center;
    }
    .tower-btn:hover { background: #1a4a80; }
    .tower-btn.selected { border-color: #ffd700 !important; background: #1a4a80; }
    .tower-btn.cant-afford { opacity: 0.4; cursor: not-allowed; }

    .tower-icon {
      width: 42px;
      height: 78px;          /* Turm-Frame ist 70x130 → Hochformat beibehalten */
      flex-shrink: 0;
      image-rendering: pixelated;
      border: none;          /* kein Rahmen ums Icon (überschreibt canvas-Regel) */
    }
    .tower-btn .info { display: flex; flex-direction: column; align-items: center; }
    .tower-btn .tname { font-weight: bold; }
    .tower-btn .tcost { color: #ffd700; font-size: 0.78rem; }
    .tower-btn .tdesc { color: #999; font-size: 0.72rem; line-height: 1.3; }

    #sell-hint {
      width: 100%;
      font-size: 0.72rem;
      color: #888;
      text-align: center;
      padding: 2px 0;
    }

    #wave-ctrl {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    button.action-btn {
      background: #e0a020;
      color: #111;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
      width: 100%;
    }
    button.action-btn:hover:not(:disabled) { background: #f0b830; }
    button.action-btn:disabled { background: #554010; color: #888; cursor: not-allowed; }

    button.restart-btn {
      background: #3a7bd5;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 10px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.restart-btn:hover { background: #4a8be5; }

    #wave-info {
      font-size: 0.8rem;
      color: #888;
      text-align: center;
    }

    #legend {
      background: #16213e;
      border: 1px solid #334;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.75rem;
      color: #999;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #legend h3 { font-size: 0.78rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    /* ─── Mobiles Layout: schmale Bildschirme ─────────────────── */
    @media (max-width: 820px) {
      /* Alles vertikal stapeln: Canvas oben, Steuerung darunter */
      #game-container {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      #sidebar {
        width: 100%;
      }

      /* Shop-Buttons nebeneinander in einer Reihe, kompakter */
      #shop {
        flex-direction: row;
        flex-wrap: wrap;
      }
      #shop h3 { width: 100%; }
      .tower-btn {
        flex: 1 1 0;
        min-width: 90px;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 4px;
        padding: 10px 6px;
      }
      /* Beschreibungstext auf engem Raum ausblenden */
      .tower-btn .tdesc { display: none; }
      .tower-icon { width: 32px; height: 59px; }

      /* Verkauf-Hinweis über volle Breite */
      #sell-hint { width: 100%; }

      /* Größere Touch-Targets für den Wellen-Button */
      button.action-btn {
        padding: 14px;
        font-size: 1rem;
      }

      /* Legende braucht am Handy keinen Platz */
      #legend { display: none; }

      h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>


  <div id="game-container">
    <div id="hud">
      <div class="row">
        <span class="label">❤️ Leben</span>
        <span class="val-lives" id="hud-lives">20</span>
      </div>
      <div class="row">
        <span class="label">💰 Gold</span>
        <span class="val-gold" id="hud-gold">150</span>
      </div>
      <div class="row">
        <span class="label">🌊 Welle</span>
        <span class="val-wave" id="hud-wave">0 / 10</span>
      </div>
    </div>

    <div id="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="overlay">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button class="restart-btn" id="restart-btn">Neu starten</button>
      </div>
    </div>

    <div id="sidebar">
      <div id="wave-ctrl">
        <button class="action-btn" id="btn-start-wave">▶ Welle starten</button>
        <div id="wave-info">Platziere Türme, dann starte!</div>
      </div>

      <div id="shop">
        <h3>Türme kaufen</h3>
        <button class="tower-btn" id="btn-tower-normal" data-type="normal">
          <canvas class="tower-icon" data-type="normal"></canvas>
          <div class="info">
            <span class="tname">Normal</span>
            <span class="tcost">💰 50</span>
            <span class="tdesc">Einzelschuss, mittlere Reichweite</span>
          </div>
        </button>
        <button class="tower-btn" id="btn-tower-splash" data-type="splash">
          <canvas class="tower-icon" data-type="splash"></canvas>
          <div class="info">
            <span class="tname">Splash</span>
            <span class="tcost">💰 80</span>
            <span class="tdesc">Flächenschaden beim Einschlag</span>
          </div>
        </button>
        <button class="tower-btn" id="btn-tower-slow" data-type="slow">
          <canvas class="tower-icon" data-type="slow"></canvas>
          <div class="info">
            <span class="tname">Slow</span>
            <span class="tcost">💰 60</span>
            <span class="tdesc">Verlangsamt Gegner</span>
          </div>
        </button>
        <div id="sell-hint">Verkaufen (voller Preis): Rechtsklick · am Handy langer Druck auf den Turm</div>
      </div>

      <div id="legend">
        <h3>Legende</h3>
        <div class="legend-row"><div class="legend-dot" style="background:#2ecc40;"></div> Start</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ff4136;"></div> Ziel</div>
        <div class="legend-row"><div class="legend-dot" style="background:#3a3a5c;"></div> Pfad</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ff4444;border-radius:50%;"></div> Gegner</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ffe04b;border-radius:50%;"></div> Projektil</div>
      </div>
    </div>
  </div>

  <!-- Reihenfolge ist wichtig: Abhängigkeiten zuerst, game.js zuletzt -->
  <script src="js/telegram.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/pathfinder.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/wave.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
